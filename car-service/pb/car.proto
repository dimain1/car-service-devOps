syntax = "proto3";

package pb;

option go_package = "./pb";

service CarService {
  rpc Create (CreateRequest) returns (CreateResponse) {}
  rpc GetByID (GetByIDRequest) returns (GetByIDResponse) {}
  rpc MarkSold (MarkSoldRequest) returns (MarkSoldResponse) {}
}

message Car {
  string id = 1;
  string brand = 2;
  string model = 3;
  int32 year = 4;
  double price = 5;
  bool sold = 6;
}

message CreateRequest {
  Car car = 1;
}

message CreateResponse {
  string id = 1;
  string err = 2;
}

message GetByIDRequest {
  string id = 1;
}

message GetByIDResponse {
  Car car = 1;
  string err = 2;
}

message MarkSoldRequest {
  string id = 1;
}

message MarkSoldResponse {
  string err = 1;
}